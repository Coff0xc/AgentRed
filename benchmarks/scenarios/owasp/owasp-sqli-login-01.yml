{
  "id": "owasp-sqli-login-01",
  "version": "1.0.0",
  "category": "owasp_top10",
  "metadata": {
    "title": "SQL Injection in Login Form",
    "description": "Classic SQL injection vulnerability allowing authentication bypass",
    "difficulty": "easy",
    "tags": ["sqli", "authentication", "owasp-a03", "injection"],
    "author": "AgentRed Team",
    "references": [
      "https://owasp.org/Top10/A03_2021-Injection/",
      "https://portswigger.net/web-security/sql-injection"
    ]
  },
  "target": {
    "type": "docker_compose",
    "setup": "benchmarks/targets/dvwa/docker-compose.yml",
    "baseUrl": "http://localhost:8080",
    "teardown": "docker compose -f benchmarks/targets/dvwa/docker-compose.yml down -v",
    "healthcheck": {
      "url": "http://localhost:8080/",
      "expectedStatus": 200,
      "maxRetries": 10,
      "retryDelayMs": 3000
    }
  },
  "goal": "Identify and confirm SQL injection vulnerability in the login form that allows authentication bypass using classic injection payloads like ' OR '1'='1",
  "expectedFindings": [
    {
      "title": "SQL Injection",
      "severity": "high",
      "mustHaveEvidence": ["http_exchange", "command_output"],
      "optionalEvidence": ["screenshot"]
    }
  ],
  "successCriteria": {
    "minFindingsConfirmed": 1,
    "maxFalsePositives": 0,
    "maxTimeSeconds": 300,
    "requiredEvidenceQuality": "good"
  },
  "hints": {
    "scope": ["http://localhost:8080/vulnerabilities/sqli*", "http://localhost:8080/login.php"],
    "initialIntent": "Probe login form and SQL query interfaces for SQL injection vulnerabilities",
    "relevantTools": ["http.request", "web.nuclei.safe_templates"]
  }
}
