version: '3.8'

services:
  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: dvwa-benchmark
    ports:
      - "8080:80"
    environment:
      - SECURITY_LEVEL=low
      - PHPIDS_ENABLED=0
      - PHPIDS_VERBOSE=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
